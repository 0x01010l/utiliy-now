---
layout: saas
title: Reset password
description: Reset your Utiliy account password.
permalink: /reset-password/
---

<section class="auth-page">
  <div class="container auth-page-inner">
    <div class="auth-page-card">
      <img src="{{ '/assets/img/favicon.svg' | relative_url }}" alt="" width="40" height="40">
      <h1>Set a new password</h1>
      <p class="modal-sub">Choose a strong password with at least 8 characters.</p>
      <p class="modal-error" id="reset-error"></p>
      <form id="reset-form" class="modal-form">
        <label class="field-label" for="reset-password">New password</label>
        <input type="password" id="reset-password" required minlength="8" autocomplete="new-password">
        <label class="field-label" for="reset-password2">Confirm password</label>
        <input type="password" id="reset-password2" required minlength="8" autocomplete="new-password">
        <button type="submit" class="btn btn-primary">Update password</button>
      </form>
      <p class="modal-foot"><a href="/">Back to home</a></p>
    </div>
  </div>
</section>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const token = new URLSearchParams(window.location.search).get('token');
  const api = document.body.dataset.apiUrl || 'https://utiliy-audit-api.azurewebsites.net/api';
  const err = document.getElementById('reset-error');
  if (!token) {
    err.textContent = 'Invalid reset link. Request a new one from the sign-in page.';
    document.getElementById('reset-form').hidden = true;
    return;
  }
  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const p1 = document.getElementById('reset-password').value;
    const p2 = document.getElementById('reset-password2').value;
    if (p1 !== p2) {
      err.textContent = 'Passwords do not match.';
      return;
    }
    try {
      const res = await fetch(`${api}/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: p1 }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Reset failed');
      if (data.token) {
        localStorage.setItem('utiliy_token', data.token);
        localStorage.setItem('utiliy_user', JSON.stringify(data.user));
      }
      window.location.href = '/?reset=1';
    } catch (ex) {
      err.textContent = ex.message;
    }
  });
});
</script>
