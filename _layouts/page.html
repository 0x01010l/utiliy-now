---
layout: default
---
<article class="page-article">
  <header class="page-hero">
    <div class="container">
      <h1>{{ page.title }}</h1>
      {% if page.description %}
      <p class="page-lead">{{ page.description }}</p>
      {% endif %}
    </div>
  </header>
  <div class="container prose page-body">
    {{ content }}
  </div>
</article>
