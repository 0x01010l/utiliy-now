  <text x="458" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#44403c">recursive DNS</text>
  <path d="M528 102h36" stroke="#c2410c" stroke-width="2"/>
  <rect x="572" y="70" width="128" height="64" rx="10" fill="#f3ede4" stroke="#e7e0d5"/>
