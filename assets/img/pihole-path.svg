<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="t">
  <title id="t">Traffic path through Pi-hole, Unbound, and WireGuard</title>
  <rect width="720" height="220" fill="#fffcf8" rx="12"/>
  <rect x="20" y="70" width="140" height="64" rx="10" fill="#f3ede4" stroke="#e7e0d5"/>
  <text x="90" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#1c1917">Phone / laptop</text>
  <path d="M160 102h36" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="204" y="70" width="140" height="64" rx="10" fill="#134e4a"/>
  <text x="274" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#ecfdf5">Pi-hole</text>
  <text x="274" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#99f6e4">filter ads</text>
  <path d="M344 102h36" stroke="#c2410c" stroke-width="2"/>
  <rect x="388" y="70" width="140" height="64" rx="10" fill="#f3ede4" stroke="#e7e0d5"/>
