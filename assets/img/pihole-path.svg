  <text x="24" y="32" font-family="system-ui,sans-serif" font-size="13" fill="#0f766e" font-weight="700">HOME PRIVACY PI  QUERY PATH</text>
  <text x="24" y="196" font-family="system-ui,sans-serif" font-size="13" fill="#44403c">WireGuard sits on the same Pi so travel traffic uses this path too.</text>
