<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t">
  <title id="t">Wi-Fi before and after moving the router</title>
  <rect width="720" height="280" fill="#fffcf8" rx="12"/>
  <text x="24" y="36" font-family="system-ui,sans-serif" font-size="14" fill="#0f766e" font-weight="700">SPEED IN THE BACK BEDROOM</text>
  <rect x="40" y="80" width="48" height="120" fill="#e7e0d5"/>
  <rect x="40" y="152" width="48" height="48" fill="#c2410c"/>
  <text x="40" y="220" font-family="system-ui,sans-serif" font-size="12" fill="#44403c">Before 8 Mbps</text>
  <rect x="160" y="80" width="48" height="120" fill="#e7e0d5"/>
  <rect x="160" y="80" width="48" height="120" fill="#0f766e"/>
  <text x="160" y="220" font-family="system-ui,sans-serif" font-size="12" fill="#44403c">After 34 Mbps</text>
  <text x="280" y="110" font-family="Georgia, serif" font-size="22" fill="#1c1917">What changed</text>
  <text x="280" y="145" font-family="system-ui,sans-serif" font-size="15" fill="#44403c">1. Router out of the TV cabinet</text>
  <text x="280" y="172" font-family="system-ui,sans-serif" font-size="15" fill="#44403c">2. 2.4 GHz moved off crowded channel 6</text>
  <text x="280" y="199" font-family="system-ui,sans-serif" font-size="15" fill="#44403c">3. Old router switched to access-point mode</text>
  <text x="280" y="226" font-family="system-ui,sans-serif" font-size="15" fill="#44403c">4. IoT devices moved to guest SSID</text>
</svg>
