<form class="audit-form optimizer-entry" id="audit-form" action="#" method="post">
  <label class="sr-only" for="audit-url">Product page URL</label>
  <div class="audit-input-row">
    <input type="url" id="audit-url" name="url" required placeholder="Paste product URL to open the AI lab…" autocomplete="url" inputmode="url">
    <button type="submit" class="btn btn-primary" id="audit-submit">Open AI lab</button>
  </div>
  <p class="audit-hint">We scan for weaknesses → you fix them with AI-generated copy in the lab</p>
</form>
<div class="audit-progress" id="audit-progress" hidden aria-live="polite"></div>
<div class="audit-results" id="audit-results" hidden></div>
