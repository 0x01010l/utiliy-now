<form class="audit-form" id="audit-form" action="#" method="post">
  <label class="sr-only" for="audit-url">Product page URL</label>
  <div class="audit-input-row">
    <input type="url" id="audit-url" name="url" required placeholder="https://yourstore.com/products/example" autocomplete="url" inputmode="url">
    <button type="submit" class="btn btn-primary" id="audit-submit">Analyze product page</button>
  </div>
  <p class="audit-hint">Works on Shopify, WooCommerce, and most public product URLs. No login required.</p>
</form>
<div id="audit-status" class="audit-status" hidden aria-live="polite"></div>
<div id="audit-results" class="audit-results" hidden></div>
