<form class="audit-form" id="audit-form" action="#" method="post">
  <label class="sr-only" for="audit-url">Product page URL</label>
  <div class="audit-input-row">
    <input type="url" id="audit-url" name="url" required placeholder="https://yourstore.com/products/example" autocomplete="url" inputmode="url">
    <button type="submit" class="btn btn-primary" id="audit-submit">Run audit lab</button>
  </div>
  <p class="audit-hint">Full SEO lab · keywords · schema · images · page code · fix queue · 1 free audit</p>
</form>
<div class="audit-progress" id="audit-progress" hidden aria-live="polite"></div>
<div class="audit-results" id="audit-results" hidden></div>
