<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ site.url }}/#organization",
      "name": "{{ site.company.name }}",
      "legalName": "{{ site.company.legal_name }}",
      "url": "{{ site.url }}",
      "email": "{{ site.company.email }}",
      "foundingDate": "{{ site.company.founded }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ site.url }}{{ site.logo }}"
      },
      "brand": {
        "@type": "Brand",
        "name": "Utiliy",
        "url": "{{ site.url }}"
      },
      "sameAs": [
        "{{ site.url }}/",
        "{{ site.url }}/about/",
        "{{ site.url }}/contact/"
      ],
      "knowsAbout": [
        {
          "@type": "Thing",
          "name": "Search engine optimization",
          "sameAs": "https://en.wikipedia.org/wiki/Search_engine_optimization"
        },
        {
          "@type": "Thing",
          "name": "Electronic commerce",
          "sameAs": "https://en.wikipedia.org/wiki/E-commerce"
        },
        {
          "@type": "Thing",
          "name": "Structured data",
          "sameAs": "https://en.wikipedia.org/wiki/JSON-LD"
        },
        {
          "@type": "Thing",
          "name": "Generative artificial intelligence",
          "sameAs": "https://en.wikipedia.org/wiki/Generative_artificial_intelligence"
        }
      ]
    },
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}",
      "name": "Utiliy",
      "description": {{ site.description | jsonify }},
      "publisher": { "@id": "{{ site.url }}/#organization" },
      "inLanguage": "en-US"
    },
    {
      "@type": "Service",
      "@id": "{{ site.url }}/#service",
      "name": "AI Product Page Optimization",
      "description": "Automated SEO and AI visibility audits for ecommerce product detail pages with copy-paste fixes.",
      "url": "{{ site.url }}/",
      "provider": { "@id": "{{ site.url }}/#organization" },
      "serviceType": "Product page SEO audit and AI listing optimization",
      "areaServed": { "@type": "Place", "name": "Worldwide" },
      "audience": {
        "@type": "BusinessAudience",
        "audienceType": "Ecommerce merchants, SEO teams, and agencies"
      },
      "isRelatedTo": [
        {
          "@type": "Organization",
          "name": "Shopify",
          "url": "https://www.shopify.com",
          "sameAs": [
            "https://www.shopify.com",
            "https://en.wikipedia.org/wiki/Shopify"
          ]
        },
        {
          "@type": "Organization",
          "name": "WooCommerce",
          "url": "https://woocommerce.com",
          "sameAs": "https://en.wikipedia.org/wiki/WooCommerce"
        },
        {
          "@type": "Organization",
          "name": "Amazon",
          "url": "https://www.amazon.com",
          "sameAs": "https://en.wikipedia.org/wiki/Amazon_(company)"
        },
        {
          "@type": "Organization",
          "name": "Google",
          "url": "https://www.google.com",
          "sameAs": "https://en.wikipedia.org/wiki/Google"
        }
      ]
    },
    {
      "@type": "WebApplication",
      "@id": "{{ site.url }}/#application",
      "name": "Utiliy AI Product Page Optimizer",
      "url": "{{ site.url }}/ai-lab/",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "SEO Software",
      "operatingSystem": "Web",
      "browserRequirements": "Requires JavaScript",
      "description": "AI-powered product page optimization tool for ecommerce. Audits Google SEO, schema markup, keywords, images, and AI shopping visibility on Shopify, WooCommerce, Amazon, and headless product detail pages.",
      "featureList": [
        "AI product page optimization",
        "Product page SEO audit",
        "Shopify product page SEO checker",
        "WooCommerce product SEO analysis",
        "Amazon listing optimization",
        "Product schema JSON-LD validation",
        "Meta title and description optimizer",
        "AI shopping and GEO visibility scoring",
        "Image alt text and gallery audit",
        "Copy-paste SEO fix snippets"
      ],
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "USD",
          "description": "One full product page optimization report"
        },
        {
          "@type": "Offer",
          "name": "Pro",
          "price": "24",
          "priceCurrency": "USD",
          "description": "80 product page optimizations per month"
        }
      ],
      "provider": { "@id": "{{ site.url }}/#organization" },
      "maintainer": { "@id": "{{ site.url }}/#organization" },
      "isPartOf": { "@id": "{{ site.url }}/#website" },
      "about": [
        {
          "@type": "Thing",
          "name": "Product detail page",
          "sameAs": "https://en.wikipedia.org/wiki/Product_(business)"
        },
        {
          "@type": "Thing",
          "name": "Schema.org Product",
          "url": "https://schema.org/Product",
          "sameAs": "https://schema.org/Product"
        },
        {
          "@type": "Organization",
          "name": "Shopify",
          "sameAs": "https://en.wikipedia.org/wiki/Shopify"
        },
        {
          "@type": "Organization",
          "name": "WooCommerce",
          "sameAs": "https://en.wikipedia.org/wiki/WooCommerce"
        },
        {
          "@type": "Organization",
          "name": "Amazon",
          "sameAs": "https://en.wikipedia.org/wiki/Amazon_(company)"
        }
      ],
      "isBasedOn": [
        {
          "@type": "CreativeWork",
          "name": "Schema.org vocabulary",
          "url": "https://schema.org/",
          "sameAs": "https://en.wikipedia.org/wiki/Schema.org"
        },
        {
          "@type": "CreativeWork",
          "name": "JSON-LD",
          "url": "https://json-ld.org/",
          "sameAs": "https://en.wikipedia.org/wiki/JSON-LD"
        },
        {
          "@type": "CreativeWork",
          "name": "Google Search documentation — Product structured data",
          "url": "https://developers.google.com/search/docs/appearance/structured-data/product"
        }
      ],
      "citation": [
        {
          "@type": "SoftwareApplication",
          "name": "Azure OpenAI Service",
          "url": "https://learn.microsoft.com/azure/ai-services/openai/",
          "applicationCategory": "DeveloperApplication",
          "provider": {
            "@type": "Organization",
            "name": "Microsoft",
            "url": "https://www.microsoft.com",
            "sameAs": [
              "https://www.microsoft.com",
              "https://en.wikipedia.org/wiki/Microsoft"
            ]
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "Azure AI Vision",
          "url": "https://learn.microsoft.com/azure/ai-services/computer-vision/",
          "applicationCategory": "DeveloperApplication",
          "provider": {
            "@type": "Organization",
            "name": "Microsoft",
            "sameAs": "https://en.wikipedia.org/wiki/Microsoft"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "Azure Functions",
          "url": "https://learn.microsoft.com/azure/azure-functions/",
          "applicationCategory": "DeveloperApplication",
          "provider": {
            "@type": "Organization",
            "name": "Microsoft",
            "sameAs": "https://en.wikipedia.org/wiki/Microsoft_Azure"
          }
        },
        {
          "@type": "Organization",
          "name": "OpenAI",
          "url": "https://openai.com",
          "sameAs": [
            "https://openai.com",
            "https://en.wikipedia.org/wiki/OpenAI"
          ]
        },
        {
          "@type": "Organization",
          "name": "Stripe",
          "url": "https://stripe.com",
          "sameAs": [
            "https://stripe.com",
            "https://en.wikipedia.org/wiki/Stripe_(company)"
          ]
        }
      ]
    }
    {% if page.home %}
    ,{
      "@type": "FAQPage",
      "@id": "{{ site.url }}/#faq",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is an AI product page optimizer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An AI product page optimizer analyzes a single ecommerce product detail page (PDP) for SEO, structured data, keywords, images, and AI shopping visibility, then suggests prioritized fixes with ready-to-paste copy for your theme or CMS."
          }
        },
        {
          "@type": "Question",
          "name": "Does Utiliy work on Shopify product pages?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Utiliy supports Shopify, headless Shopify storefronts, WooCommerce, Amazon, and any public product URL with HTML or JSON-LD product data."
          }
        },
        {
          "@type": "Question",
          "name": "How is this different from a generic SEO audit tool?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Utiliy focuses on one high-intent product page at a time — scoring six visibility pillars (Google SEO, AI visibility, content, keywords, images, schema) and opening an AI lab with copy-paste fixes instead of a static PDF report."
          }
        },
        {
          "@type": "Question",
          "name": "What stores does Utiliy support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Any public product page URL. Enhanced extractors cover Shopify, headless commerce, WooCommerce, Amazon, and standard JSON-LD markup."
          }
        },
        {
          "@type": "Question",
          "name": "How does the free product page audit work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You get one complete optimization report free, tracked per account and IP. Paste a product URL, run the scan, and open the AI lab to copy fixes."
          }
        },
        {
          "@type": "Question",
          "name": "How do I optimize a product page for Google and AI search?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Audit the live URL for title tag length, meta description, canonical URL, structured data, keyword placement, image alt text, and product facts machines need for recommendations — then apply fixes in priority order."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a free product page SEO audit for ecommerce?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Utiliy includes one full optimization report free: paste a public product URL, review six visibility pillars, and copy AI-generated snippets into your storefront or marketplace listing."
          }
        },
        {
          "@type": "Question",
          "name": "How is Utiliy different from Semrush, Ahrefs, or Surfer SEO?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Site-wide platforms like Semrush and Ahrefs excel at domain audits and rank tracking. Surfer and Jasper focus on content drafts. Utiliy goes deep on a single product detail page — schema, gallery, keywords, and AI visibility — with copy-paste fixes for your theme or CMS."
          }
        }
      ]
    }
    {% endif %}
    {% unless page.home %}
    ,{
      "@type": "WebPage",
      "@id": "{{ site.url }}{{ page.url }}#webpage",
      "url": "{{ site.url }}{{ page.url }}",
      "name": {{ page.title | default: site.title | jsonify }},
      "description": {{ page.description | default: site.description | jsonify }},
      "isPartOf": { "@id": "{{ site.url }}/#website" },
      "publisher": { "@id": "{{ site.url }}/#organization" },
      "inLanguage": "en-US"
    }
    {% endunless %}
  ]
}
</script>
