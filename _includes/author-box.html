<aside class="author-box">
  <div class="author-avatar" aria-hidden="true">{{ site.author.name | slice: 0 }}</div>
  <div>
    <p class="author-label">Written by</p>
    <p class="author-name">{{ site.author.name }}</p>
    <p class="author-bio">{{ site.author.bio }}</p>
    <a class="author-link" href="{{ '/about/' | relative_url }}">More about the author →</a>
  </div>
</aside>
