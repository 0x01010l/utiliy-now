<div class="modal-overlay" id="auth-modal" hidden>
  <div class="modal" role="dialog" aria-labelledby="auth-title">
    <h2 id="auth-title">Sign in</h2>
    <p>Save audits and upgrade to Pro for unlimited product page analysis.</p>
    <p class="modal-error" id="auth-error"></p>
    <form id="auth-form">
      <input type="hidden" id="auth-mode" value="login">
      <label class="sr-only" for="auth-email">Email</label>
      <input type="email" id="auth-email" required placeholder="you@store.com" autocomplete="email">
      <label class="sr-only" for="auth-password">Password</label>
      <input type="password" id="auth-password" required placeholder="Password (8+ characters)" minlength="8" autocomplete="current-password">
      <button type="submit" class="btn btn-primary" id="auth-submit" style="width:100%;">Sign in</button>
    </form>
    <p style="margin-top:1rem;text-align:center;">
      <button type="button" class="btn btn-ghost btn-sm" id="auth-toggle" style="border:none;">Need an account? Register</button>
    </p>
    <button type="button" class="btn btn-ghost btn-sm" data-close-modal="auth-modal" style="margin-top:.5rem;width:100%;">Close</button>
  </div>
</div>

<div class="modal-overlay" id="paywall-modal" hidden>
  <div class="modal" role="dialog">
    <h2>Upgrade to continue</h2>
    <p id="paywall-msg">Your free audit is used. Upgrade to Pro for unlimited product page audits.</p>
    <button type="button" class="btn btn-primary" data-checkout style="width:100%;margin-top:1rem;">Upgrade to Pro — $15/mo</button>
    <p style="font-size:.82rem;color:var(--muted);margin-top:.75rem;">Sign in first if you haven't. Stripe secure checkout.</p>
    <button type="button" class="btn btn-ghost btn-sm" data-close-modal="paywall-modal" style="margin-top:.75rem;width:100%;">Maybe later</button>
  </div>
</div>
