<header class="saas-header">
  <div class="container header-row">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="Utiliy home">
      <img src="{{ '/assets/img/utiliy-logo.svg' | relative_url }}" alt="" width="148" height="36">
    </a>
    <div class="usage-tracker" id="usage-tracker" hidden>
      <div class="usage-tracker-bar"><span id="usage-bar-fill"></span></div>
      <span class="usage-tracker-text" id="usage-tracker-text">0 / 1</span>
      <button type="button" class="btn btn-ghost btn-sm" id="header-upgrade" hidden>Upgrade</button>
    </div>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">Menu</span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    <nav class="nav" id="site-nav" aria-label="Primary">
      <a href="{{ '/#audit' | relative_url }}">Optimizer</a>
      <a href="{{ '/pricing/' | relative_url }}">Pricing</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/guides/' | relative_url }}">Guides</a>
      <div class="nav-auth-mobile" id="nav-guest-mobile">
        <button type="button" class="btn btn-ghost btn-sm" id="btn-signin-mobile">Sign in</button>
        <button type="button" class="btn btn-primary btn-sm" id="btn-signup-mobile">Get started</button>
      </div>
      <div class="nav-auth-mobile" id="nav-user-mobile" hidden>
        <span class="user-pill-mobile" id="user-pill-mobile"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-signout-mobile">Log out</button>
      </div>
    </nav>
    <div class="auth-actions">
      <div id="guest-actions" class="guest-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="btn-signin">Sign in</button>
        <button type="button" class="btn btn-primary btn-sm" id="btn-signup">Get started</button>
      </div>
      <div id="logged-in-actions" class="logged-in-actions" hidden>
        <span class="user-pill" id="user-pill" title=""></span>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-signout">Log out</button>
      </div>
    </div>
  </div>
</header>

<div class="toast" id="toast" hidden role="status"></div>
