title: Utiliy
description: AI Product Page Optimizer — improve product visibility across Google Search, AI discovery (ChatGPT, Gemini, Perplexity), and on-page conversion.
url: https://utiliy.com
baseurl: ""
lang: en
timezone: UTC

theme: null
future: false

permalink: pretty
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

logo: /assets/img/utiliy-logo.svg
api_url: https://utiliy-audit-api.azurewebsites.net/api
google_client_id: "1045087131327-7j37s03u3h13rb45phtp2llks8595ap8.apps.googleusercontent.com"

company:
  name: Utiliy
  legal_name: Fix Figures LLC
  email: contact@utiliy.com
  address: "6545 Market Avenue North, North Canton, OH 44720"
  founded: "2026"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Utiliy Team

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - api
  - docs
  - node_modules
  - _archive

collections:
  guides:
    output: true
    permalink: /guides/:name/
