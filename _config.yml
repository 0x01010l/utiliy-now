title: "Utiliy"
description: "Practical guides on home networking, privacy, and earning from tech — written without the hype."
url: "https://utiliy.com"
baseurl: ""
lang: en
timezone: America/Los_Angeles

theme: null
future: false

permalink: /blog/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

logo: /assets/img/og-cover.svg

author:
  name: Mike Chen
  email: hello@utiliy.com
  location: Portland, Oregon
  bio: "Network engineer writing about privacy, home labs, and side income from setups I actually run."
  started: "2026"

# Leave blank until you add each service. Empty values are not loaded on the site.
google_analytics: ""
google_site_verification: ""
adsense_client: ""

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: Mike Chen
      image: /assets/img/og-cover.svg

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
