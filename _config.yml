title: Utiliy
description: AI product page auditor for ecommerce SEO, structured data, AI shopping readiness, and conversion clarity.
url: https://utiliy.com
baseurl: ""
lang: en
timezone: UTC

theme: null
future: false

permalink: pretty
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

logo: /assets/img/utiliy-logo.svg
api_url: https://utiliy-audit-api.azurewebsites.net/api

company:
  name: Utiliy
  email: hello@utiliy.com
  founded: "2026"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Utiliy Team

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - api
  - docs
  - node_modules
  - _archive

collections:
  guides:
    output: true
    permalink: /guides/:name/
